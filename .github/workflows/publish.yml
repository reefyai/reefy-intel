name: Publish Reefy Intel provider

on:
  workflow_call:
    inputs:
      input_artifact:
        description: Caller artifact containing exact Reefy build metadata
        required: false
        default: reefy-intel-inputs
        type: string
    outputs:
      digest:
        description: Published OCI manifest digest
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    # Publication consumes uploaded inputs, not the persistent Buildroot cache.
    runs-on: [self-hosted, Linux, X64, big-bird]
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Download exact Reefy build metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.input_artifact }}
          path: inputs

      - name: Install build and registry tools
        timeout-minutes: 10
        run: |
          sudo python3 scripts/configure_apt_https.py
          timeout 300 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          timeout 300 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends squashfs-tools jq
          download_tool() {
            timeout 300 curl -fsSL --connect-timeout 15 --max-time 120 --retry 8 \
              --retry-all-errors --retry-max-time 300 --remove-on-error \
              --output "$2" "$1"
          }
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          download_tool \
            https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz \
            "$tool_dir/oras.tar.gz"
          download_tool \
            https://github.com/sigstore/cosign/releases/download/v2.5.3/cosign-linux-amd64 \
            "$tool_dir/cosign"
          sudo tar -xz -f "$tool_dir/oras.tar.gz" -C /usr/local/bin oras
          sudo install -m 0755 "$tool_dir/cosign" /usr/local/bin/cosign

      - name: Build immutable payload
        timeout-minutes: 10
        run: |
          . inputs/metadata.env
          python3 scripts/download_xpu_smi.py --output inputs/xpu-smi-packages
          python3 scripts/stage_xpu_smi.py \
            --packages inputs/xpu-smi-packages \
            --output inputs/xpu-smi-root
          python3 scripts/build_payload.py \
            --modules-root inputs/modules-root \
            --firmware-root inputs/firmware-root \
            --xpu-smi-root inputs/xpu-smi-root \
            --kernel-release "$KERNEL_RELEASE" \
            --reefy-build-id "$REEFY_BUILD_ID" \
            --kernel-abi-digest "sha256:$REEFY_KERNEL_ABI_SHA256" \
            --output output

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: output
          format: spdx-json
          output-file: output/sbom.spdx.json

      - name: Log in to GHCR
        run: echo '${{ github.token }}' | oras login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Push OCI artifact
        id: push
        run: |
          . inputs/metadata.env
          version=$(python3 -c 'import json; print(json.load(open("versions.json"))["provider"]["version"])')
          tag="${version}-reefy-${REEFY_BUILD_ID}"
          output=$(oras push "ghcr.io/reefyai/reefy-intel:$tag" \
            --artifact-type application/vnd.reefy.artifact.v1 \
            --config output/config.json:application/vnd.reefy.artifact.config.v1+json \
            output/common.squashfs:application/vnd.reefy.squashfs.v1 \
            output/kernel.squashfs:application/vnd.reefy.squashfs.v1 \
            output/tools.squashfs:application/vnd.reefy.squashfs.v1)
          printf '%s\n' "$output"
          digest=$(printf '%s\n' "$output" | sed -n 's/^Digest: //p')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          oras attach \
            --artifact-type application/spdx+json \
            "ghcr.io/reefyai/reefy-intel@$digest" \
            output/sbom.spdx.json:application/spdx+json

      - name: Sign published manifest with GitHub OIDC
        run: cosign sign --yes "ghcr.io/reefyai/reefy-intel@${{ steps.push.outputs.digest }}"

      - name: Attest payload build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            output/config.json
            output/common.squashfs
            output/kernel.squashfs
            output/tools.squashfs
            output/sbom.spdx.json
